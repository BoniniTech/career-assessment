name: Validate YAML

on:
  push:
    branches: [main]
    paths:
      - 'live/dimensions.yaml'
      - 'live/categories.yaml'
      - 'analytics/archetypes.yaml'
      - 'scripts/validate_yaml.py'
      - '.github/workflows/validate-yaml.yml'
  pull_request:
    paths:
      - 'live/dimensions.yaml'
      - 'live/categories.yaml'
      - 'analytics/archetypes.yaml'
      - 'scripts/validate_yaml.py'
      - '.github/workflows/validate-yaml.yml'

permissions:
  contents: read

jobs:
  validate-dimensions:
    name: Validate dimensions.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python scripts/validate_yaml.py dimensions

  validate-categories:
    name: Validate categories.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python scripts/validate_yaml.py categories

  validate-archetypes:
    name: Validate archetypes.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python scripts/validate_yaml.py archetypes
