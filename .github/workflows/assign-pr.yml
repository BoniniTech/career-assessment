name: Auto-assign PR

on:
  pull_request:
    types: [opened]

# The org default GITHUB_TOKEN is read-only, so this job declares the writes it needs.
permissions:
  issues: write
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              assignees: ['vbonini'],
            });
