name: Auto-assign PR

on:
  pull_request:
    types: [opened]

# The org default GITHUB_TOKEN is read-only, so this job declares the writes it needs.
permissions:
  issues: write
  pull-requests: write

jobs:
  assign:
    # Fork PRs get a read-only token whatever this file declares, so the call would fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              assignees: ['vbonini'],
            });
